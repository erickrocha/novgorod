# Disposable test stack for kremlin. Based on ../dev (same postgres image), but nothing persists:
# the database lives in tmpfs and is gone when the stack stops. Throwaway credentials, local only.
services:
  postgres:
    image: postgres:18-alpine
    container_name: novgorod_test_postgres
    environment:
      - POSTGRES_DB=${TEST_DATABASE_NAME:-novgorod_test}
      - POSTGRES_USER=${TEST_DATABASE_USER:-novgorod_test}
      - POSTGRES_PASSWORD=${TEST_DATABASE_PASSWORD:-novgorod_test}
    ports:
      - '${TEST_DATABASE_PORT:-5433}:5432' # 5433 so it never collides with the dev database on 5432
    tmpfs:
      - /var/lib/postgresql
    networks:
      - novgorod-test-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  kremlin-tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novgorod_test_kremlin
    working_dir: /work/kremlin
    # The Postgres tests are #[ignore]d and refuse any database whose name does not end in _test.
    environment:
      - KREMLIN_TEST_DATABASE_URL=postgres://${TEST_DATABASE_USER:-novgorod_test}:${TEST_DATABASE_PASSWORD:-novgorod_test}@postgres:5432/${TEST_DATABASE_NAME:-novgorod_test}
      - CARGO_TARGET_DIR=/cargo-target
    volumes:
      - ../../kremlin:/work/kremlin
      - ../../data:/work/data:ro # a kremlin unit test reads data/wines/wine_catalog.csv
      - cargo_registry:/usr/local/cargo/registry
      - cargo_target:/cargo-target
    networks:
      - novgorod-test-network
    depends_on:
      postgres:
        condition: service_healthy
    # Override the command to run something else, e.g. `cargo test -p business --test cart_cleanup_postgres -- --ignored --nocapture`
    command: cargo test --workspace -- --include-ignored

  # ---- HTTP kit (NOV-3 T-CHK-01..03): `docker compose up -d --build --wait kremlin mpd`, then ./kit.py (see README) ----
  # Mercado Pago test double (Python stdlib). kremlin reaches it through MP_API_BASE_URL.
  mpd:
    image: python:3-alpine
    container_name: novgorod_test_mpd
    command: python /mpd.py
    volumes:
      - ./mpd.py:/mpd.py:ro
    ports:
      - '${TEST_MPD_PORT:-8099}:8099'
    networks:
      - novgorod-test-network

  # The kremlin app on the disposable database. Runs migrations at boot and seeds the SysAdmin.
  # All values below are made-up, local-only, and live only for the life of the stack.
  kremlin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novgorod_test_app
    working_dir: /work/kremlin
    command: cargo run -p application --bin kremlin
    environment:
      - DATABASE_URL=postgres://${TEST_DATABASE_USER:-novgorod_test}:${TEST_DATABASE_PASSWORD:-novgorod_test}@postgres:5432/${TEST_DATABASE_NAME:-novgorod_test}
      - HOST=0.0.0.0
      - PORT=8080
      - RUST_LOG=${TEST_KREMLIN_LOG:-info,sqlx=warn}
      - ACCESS_TOKEN_SECRET=${TEST_ACCESS_TOKEN_SECRET:-test-access-0b7f3c9e51d24a68a1c4e7d2f9b30586}
      - REFRESH_TOKEN_SECRET=${TEST_REFRESH_TOKEN_SECRET:-test-refresh-6d1e84a2c7f9405b93a0e2d8b4c71f35}
      - SYSADMIN_EMAIL=sysadmin@test.local
      - SYSADMIN_PASSWORD=${TEST_SYSADMIN_PASSWORD:-SysAdmin-test-1}
      - MP_ACCESS_TOKEN=TEST-mp-access-token-local
      - MP_COLLECTOR_ID=424242
      - MP_PUBLIC_KEY=TEST-mp-public-key-local
      - MP_API_BASE_URL=http://mpd:8099
      - MP_WEBHOOK_SECRET=${TEST_MP_WEBHOOK_SECRET:-test-mp-webhook-3a9c5e7b1d2f4860}
      - GATEWAY_TOKEN=${TEST_GATEWAY_TOKEN:-test-gateway-8f2b6d4a0c1e3957}
      # Fake local-only key ring for shipping-credential encryption tests.
      - 'SHIPPING_ENCRYPTION_KEYS={"test-only-v1":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}'
      - SHIPPING_ACTIVE_KEY_VERSION=test-only-v1
      - STOCK_EXPIRY_JOB_ENABLED=${TEST_STOCK_EXPIRY_JOB_ENABLED:-true}
      - CARGO_TARGET_DIR=/cargo-target
      # No SQS_QUEUE_URL (consumer off), no AWS_* (storage only touches S3 for images), no encryption keys
      # (shipping/payment credentials are not used; the tenants use fixed shipping, see seed.py).
    volumes:
      - ../../kremlin:/work/kremlin
      - ../../data:/work/data:ro
      - cargo_registry:/usr/local/cargo/registry
      - cargo_target:/cargo-target
    ports:
      - '${TEST_KREMLIN_PORT:-8080}:8080'
    networks:
      - novgorod-test-network
    depends_on:
      postgres:
        condition: service_healthy
      mpd:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET / HTTP/1.0\\r\\n\\r\\n\" >&3 && head -c 12 <&3 | grep -q HTTP'" ]
      interval: 5s
      timeout: 5s
      retries: 240

volumes:
  cargo_registry:
  cargo_target:

networks:
  novgorod-test-network:
    driver: bridge
