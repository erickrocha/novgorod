services:
  postgres:
    image: postgres:18-alpine
    container_name: novgorod_postgres
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_USER=${DATABASE_USER}
    ports:
      - '5432:5432'
    networks:
      - novgorod-dev-network
    volumes:
      - novgorod_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.8
    container_name: novgorod_localstack
    ports:
      - '4566:4566'
    environment:
      - SERVICES=s3,sqs
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-novgorod-media-dev}
      - SQS_QUEUE_NAME=${SQS_QUEUE_NAME:-product-image-uploads}
      - EXTRA_CORS_ALLOWED_ORIGINS=*
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d
      - ../../data/wines/images:/data/images:ro
    networks:
      - novgorod-dev-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  novgorod_data:

networks:
  novgorod-dev-network:
    driver: bridge