[workspace]
members = ["application", "entity", "migration", "business"]
default-members = ["application"]
resolver = "3"

[workspace.dependencies]
utoipa = { version = "^6.0.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "^10.0.1", features = ["axum"] }
dotenvy = "0.15.7"
tokio = { version = "1.53.3", features = ["full"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
csv = "1.4.0"
async-std = { version = "1", features = ["attributes", "tokio1"] }
aws-config = "1.12"
aws-sdk-s3 = "1.152"
aws-sdk-sqs = "1.114"
sha2 = "0.11"

[profile.release]
opt-level = 3
lto = "thin"

[profile.release.package."*"]
opt-level = 2
